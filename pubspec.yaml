name: saree_sutra
description: Material accounting, multi-item challan, supplier ledger, stitching production and pending-material tracking system.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4
  firebase_storage: ^12.1.3
  firebase_crashlytics: ^4.0.4
  firebase_analytics: ^11.2.1

  # Models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0
  logger: ^2.4.0
  flutter_local_notifications: ^17.2.2
  data_table_2: ^2.5.15
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.0

  cupertino_icons: ^1.0.8
  firebase_app_check: ^0.3.2+10
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  freezed:  
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint:  
  riverpod_lint: ^2.3.10

  mockito: ^5.4.4

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/

dependency_overrides:
  analyzer_plugin: ^0.13.4

